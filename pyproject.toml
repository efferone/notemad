[project]
name = "notemad"
version = "0.1.0"
description = "A simple tabbed note editor for Linux that doesn't require you to save"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "efferone", email = "efferone@proton.me" }]
dependencies = ["PyGObject>=3.46"]

[project.gui-scripts]
notemad = "notemad.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "bandit>=1.8",
  "hypothesis>=6.100",
  "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notemad"]

[tool.ruff]
line-length = 88

[tool.bandit]
exclude_dirs = ["tests", ".venv", "dist", "build"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that take seconds rather than milliseconds"]
