<?xml version="1.0" encoding="UTF-8"?>
<!-- Half sun, half moon. Dark mode: the moon side is lit and the sun side is
     held back with opacity, which is the only distinction a one colour
     symbolic icon can draw. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g fill-opacity="0.45">
    <path d="M8 3.4 A4.6 4.6 0 0 0 8 12.6 Z"/>
    <rect x="0.6" y="7.3" width="2.4" height="1.4" rx="0.7"/>
    <rect x="1.9" y="2.6" width="2.4" height="1.4" rx="0.7"
          transform="rotate(45 3.1 3.3)"/>
    <rect x="1.9" y="12" width="2.4" height="1.4" rx="0.7"
          transform="rotate(-45 3.1 12.7)"/>
  </g>
  <path d="M8 3.4 A4.6 4.6 0 0 1 8 12.6 Z"/>
</svg>
